{% extends 'base.html' %}{% block title %}Вход — BaaTap KG{% endblock %}{% block content %}<section class="section"><div class="container form-page"><div class="form-card"><div class="eyebrow">С возвращением</div><h1>Войти в BaaTap KG</h1><form method="post" class="styled-form">{% csrf_token %}{% if form.errors %}<p class="error-text">Неверный логин или пароль.</p>{% endif %}<div class="form-field"><label for="id_username">Логин</label><input type="text" name="username" id="id_username" autocomplete="username" required></div><div class="form-field"><label for="id_password">Пароль</label><input type="password" name="password" id="id_password" autocomplete="current-password" required></div><input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary btn-block" type="submit">Войти →</button></form><p class="form-footnote">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p></div></div></section>{% endblock %}
